# Python linters for this repository's own CI. Not a package: `uv run
# --project .github/tools` only uses it to resolve and lock these versions,
# and Dependabot's `uv` entry keeps uv.lock current.
[project]
name = "basic-github-actions-tools"
version = "0"
requires-python = ">=3.12"
dependencies = [
  "check-jsonschema==0.39.0",
  "yamllint==1.38.0",
  "zizmor==1.31.1",
]

[tool.uv]
package = false
