name: update-example-pins

# Keeps the action pins in the example workflows current.
#
# Dependabot only reads .github/workflows, so it cannot see the examples under
# <language>/workflows. This job runs pinact over them instead: it moves each
# `uses:` to the latest release, rewrites the SHA and the `# vX.Y.Z` comment
# together, and opens (or updates) one pull request with the result. The code
# snippets in the READMEs are updated the same way.
#
# The live workflows in .github/workflows are left to Dependabot.
#
# WHAT IT NEEDS
#   - Settings -> Actions -> General -> "Allow GitHub Actions to create and
#     approve pull requests" switched on.
#   - Optional, but recommended: a GitHub App with Contents and Pull requests
#     read/write on this repository, its ID in the `PIN_UPDATER_APP_ID`
#     repository variable and its private key in the `PIN_UPDATER_APP_KEY`
#     secret. A pull request opened with the default GITHUB_TOKEN does not
#     trigger other workflows, so `validate` would not run on it until someone
#     closes and reopens it or pushes to the branch. With the App configured,
#     it does.

on:
  schedule:
    # Monday, an hour after Dependabot's run for .github/.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-example-pins
  cancel-in-progress: false

jobs:
  update:
    name: update example pins
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # Wait a week before adopting a release, matching the `cooldown` in the
      # example dependabot.yml files: most malicious or broken releases are
      # caught and yanked within days.
      MIN_AGE_DAYS: "7"
    steps:
      - name: Mint a GitHub App token
        id: app-token
        if: vars.PIN_UPDATER_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PIN_UPDATER_APP_ID }}
          private-key: ${{ secrets.PIN_UPDATER_APP_KEY }}
          # Only what this job needs, not everything the App was granted.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .github/tools/go.mod
          cache-dependency-path: .github/tools/go.sum

      - name: Build pinact
        run: go build -C .github/tools -o "$RUNNER_TEMP/bin/" github.com/suzuki-shunsuke/pinact/v5/cmd/pinact

      # --update moves each action to its latest release; --min-age skips any
      # release younger than MIN_AGE_DAYS. pinact never downgrades, so a pin
      # that is already newer than the cooldown allows is left alone.
      - name: Update the pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git ls-files -z ':(exclude).github/**' '*/workflows/*.yml' '*.md' \
            | xargs -0 "$RUNNER_TEMP/bin/pinact" run --update --min-age "$MIN_AGE_DAYS"
          git diff --stat

      - name: Summarise the changes
        id: summary
        run: |
          # One line per action whose pin changed: "owner/repo vOLD -> vNEW".
          changes=$(
            git diff --unified=0 \
              | grep -E '^[-+].*uses: [^@ ]+@[0-9a-f]{40} # ' \
              | sed -E 's/^([-+]).*uses: ([^@ ]+)@[0-9a-f]{40} # ([^ ]+).*$/\1 \2 \3/' \
              | awk '$1=="-"{old[$2]=$3} $1=="+"{new[$2]=$3} END{for (a in new) print "- `" a "` " old[a] " → " new[a]}' \
              | sort
          )
          {
            echo 'body<<EOF'
            echo 'Updates the pinned actions in the example workflows and README snippets.'
            echo
            echo "${changes:-No changes.}"
            echo
            echo "Generated by \`.github/workflows/update-example-pins.yml\` with pinact (releases at least ${MIN_AGE_DAYS} days old)."
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Commits go through the API (`sign-commits`), so they are signed and
      # attributed to whichever token opened the pull request.
      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          branch: ci/update-example-pins
          delete-branch: true
          sign-commits: true
          commit-message: "ci(examples): update pinned actions"
          title: "ci(examples): update pinned actions"
          body: ${{ steps.summary.outputs.body }}
          labels: |
            dependencies
            ci
