name: Release

# Cuts a release and publishes signed, attested binaries for every target the
# project supports.
#
# The shape is: release-please holds a release pull request open against main,
# accumulating the changelog from conventional commit subjects. Merging that
# pull request tags the release, and the tag is what unblocks the build.
# Nothing here runs on an ordinary merge.
#
# WHY THIS ONE IS SIMPLER THAN THE OTHERS
#   Zig cross-compiles from a single runner to every target it supports, libc
#   included, with nothing to install. So there is no per-runner matrix, no
#   QEMU, no cargo-zigbuild, no lipo dance for macOS — one Linux job builds
#   the lot. It is the cheapest release matrix of any language in this
#   library, which is a reason to make it wide.
#
# WHAT EACH ARTIFACT COMES WITH
#   archive.tar.gz            the binary, README and LICENSE
#   archive.tar.gz.sha256     the checksum, for a quick manual check
#   archive.tar.gz.sigstore   a Sigstore bundle: signature, certificate and
#                             inclusion proof in one file
#   SHA256SUMS(.sigstore)     every checksum in one signed file
#   plus, in GitHub's attestation store, a signed SLSA provenance statement
#   for each archive
#
# None of that needs a key. The provenance and the cosign signature both use
# the workflow's OIDC identity, so what a verifier checks is "this artifact
# was built by this workflow, in this repository, from this commit".
#
# HOW A USER VERIFIES IT
#   gh attestation verify ./tool-v1.2.3-x86_64-linux-musl.tar.gz \
#     --repo OWNER/REPO
#
#   cosign verify-blob \
#     --bundle tool-v1.2.3-x86_64-linux-musl.tar.gz.sigstore \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github.com/OWNER/REPO/' \
#     ./tool-v1.2.3-x86_64-linux-musl.tar.gz
#
# NO SBOM
#   Unlike the other languages here, there is no SBOM step. Syft has no Zig
#   analyser, so it would produce an SBOM listing nothing, which is worse than
#   none at all — an empty SBOM reads as "no dependencies" rather than "not
#   measured". If the project vendors C libraries, add an `anchore/sbom-action`
#   step over the source tree, where Syft does find them.
#
# WHAT TO CHANGE
#   1. `BINARY_NAME` below. This is the one that matters: it is the name
#      `b.addExecutable` was given in build.zig, and the stem of every
#      archive.
#   2. `ZIG_VERSION`. Keep it equal to the one in ci.yml, so what is released
#      is what was tested.
#   3. The build matrix. `zig targets` prints every target the compiler knows.
#      Each entry becomes one archive on the release.
#   4. `OPTIMIZE`. ReleaseSafe keeps the bounds and overflow checks in the
#      shipped binary and costs a few per cent; ReleaseFast removes them and
#      turns what would have been a panic into undefined behaviour.
#      ReleaseSafe is the right default for anything that parses input it did
#      not write.
#   5. `EXTRA_FILES`, for anything else that belongs in the archive.
#
# WHAT IT NEEDS
#   - release-please-config.json and .release-please-manifest.json at the
#     repository root. See universal/ in this library for both.
#   - Squash merging with the pull request title as the commit subject:
#       Settings -> General -> Pull Requests -> Default commit message
#   - A public repository, or GitHub Advanced Security, for the attestation
#     step. On a private repository without it, delete that step; the cosign
#     bundle still works.
#   - No secrets.
#
# WHAT IT PRODUCES
#   - A GitHub release, tagged, with the artifacts above attached.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKING_DIRECTORY: "."
  ZIG_VERSION: "0.15.2"
  # The executable name from build.zig, and the stem of every archive.
  BINARY_NAME: "tool"
  # ReleaseSafe | ReleaseFast | ReleaseSmall
  OPTIMIZE: "ReleaseSafe"
  # Files copied into every archive alongside the binary. Space-separated.
  EXTRA_FILES: "README.md LICENSE"

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: build (${{ matrix.target }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # Every target from one Linux runner. Zig ships each target's libc and
    # linker, so there is nothing a macOS or Windows runner would add.
    runs-on: ubuntu-latest
    permissions:
      # Uploading the artifacts to the release.
      contents: write
      # The OIDC token the attestation and the signature are bound to.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target:
          # musl, so one Linux binary per architecture runs on any
          # distribution with no libc version to worry about.
          - x86_64-linux-musl
          - aarch64-linux-musl
          - arm-linux-musleabihf
          - riscv64-linux-musl
          # glibc builds as well, for anything that needs to dlopen a system
          # library. Delete these if the project is pure Zig.
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows-gnu
          - aarch64-windows-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: true

      - name: Build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          zig build \
            -Dtarget=${{ matrix.target }} \
            -Doptimize=${{ env.OPTIMIZE }} \
            --prefix zig-out \
            --summary all
          ls -lR zig-out

      - name: Package
        id: package
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          name="${BINARY_NAME}-${TAG}-${TARGET}"
          mkdir -p "staging/${name}"

          if [[ "$TARGET" == *windows* ]]; then
            cp "zig-out/bin/${BINARY_NAME}.exe" "staging/${name}/"
          else
            cp "zig-out/bin/${BINARY_NAME}" "staging/${name}/"
          fi
          # Unquoted on purpose: EXTRA_FILES is a space-separated list.
          # shellcheck disable=SC2086
          [ -n "${EXTRA_FILES}" ] && cp ${EXTRA_FILES} "staging/${name}/"

          cd staging
          if [[ "$TARGET" == *windows* ]]; then
            archive="${name}.zip"
            zip -qr "$archive" "$name"
          else
            # --sort=name and a fixed mtime, so the same commit tars to the
            # same bytes rather than embedding the build time.
            archive="${name}.tar.gz"
            tar --sort=name --owner=0 --group=0 --numeric-owner \
                --mtime="@0" -czf "$archive" "$name"
          fi
          sha256sum "$archive" > "${archive}.sha256"

          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "dir=${{ env.WORKING_DIRECTORY }}/staging" >> "$GITHUB_OUTPUT"

      # A signed SLSA provenance statement: which workflow, at which commit,
      # on which runner, produced exactly these bytes. Stored by GitHub
      # against the repository and checked with `gh attestation verify`.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.dir }}/${{ steps.package.outputs.archive }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Belt and braces alongside the attestation above. The attestation lives
      # in GitHub's store and needs `gh` to check; this bundle sits next to
      # the artifact and can be checked by anyone with cosign and no GitHub
      # account. Keyless: the certificate is issued to this workflow's OIDC
      # identity, so there is no key to manage.
      - name: Sign the archive
        working-directory: ${{ steps.package.outputs.dir }}
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          COSIGN_YES: "true"
        run: cosign sign-blob --bundle "${ARCHIVE}.sigstore" "$ARCHIVE"

      - name: Upload to the release
        working-directory: ${{ steps.package.outputs.dir }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release upload "$TAG" \
            "$ARCHIVE" \
            "${ARCHIVE}.sha256" \
            "${ARCHIVE}.sigstore" \
            --clobber

  # One SHA256SUMS covering every target, so a user or a package manager can
  # fetch a single file and check whichever archive they downloaded. Signed
  # too, because an unsigned checksum file is only as trustworthy as the
  # connection that fetched it.
  checksums:
    name: checksums
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Combine and sign the checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          mkdir sums && cd sums
          gh release download "$TAG" --pattern '*.sha256' --dir .
          # sorted, so the file is stable between runs regardless of the order
          # the matrix jobs happened to finish in.
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          cosign sign-blob --bundle SHA256SUMS.sigstore SHA256SUMS
          gh release upload "$TAG" SHA256SUMS SHA256SUMS.sigstore --clobber
