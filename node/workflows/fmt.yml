name: fmt

# Catches formatting and lock-file drift, both of which have a mechanical fix
# and neither of which needs a review conversation. Kept separate from
# codequality.yml because a lint finding needs a decision and a formatting
# finding needs one command.
#
# Checks rather than reformats. A workflow that pushes formatting commits back
# to the branch fights the developer's editor and cannot work on a fork.
#
# WHAT TO CHANGE
#   1. `PACKAGE_MANAGER`: npm, pnpm or yarn.
#   2. `WORKING_DIRECTORY`, if package.json is not at the repository root.
#   3. `FORMATTER`: prettier or biome. Prettier is the default and the more
#      widely used; Biome is one binary that formats and lints, and is much
#      faster on a large tree. Do not run both — they disagree about
#      whitespace and you will get an unwinnable check.
#   4. The `.prettierignore` or `biome.json` `ignore` list, for generated
#      files. A formatter that reformats generated output produces a diff on
#      every regeneration.
#
# WHAT IT NEEDS
#   - The formatter as a devDependency, so the version here is the version
#     developers run locally. A CI formatter one minor version ahead of the
#     local one reformats different files and the check becomes noise.
#   - Nothing else. No secrets.
#
# WHAT IT PRODUCES
#   - One status check. Its log prints the diff and names the command to run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fmt-${{ github.ref }}
  cancel-in-progress: true

env:
  # npm | pnpm | yarn
  PACKAGE_MANAGER: "pnpm"
  WORKING_DIRECTORY: "."
  PNPM_VERSION: "10"
  NODE_VERSION: "24"
  # prettier | biome
  FORMATTER: "prettier"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.PACKAGE_MANAGER == 'pnpm'
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ env.PACKAGE_MANAGER }}
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/${{ env.PACKAGE_MANAGER == 'npm' && 'package-lock.json' || env.PACKAGE_MANAGER == 'pnpm' && 'pnpm-lock.yaml' || 'yarn.lock' }}

      - name: Install
        run: |
          set -euo pipefail
          case "$PACKAGE_MANAGER" in
            npm)  npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --immutable || yarn install --frozen-lockfile ;;
          esac

      - name: Format check
        run: |
          set -euo pipefail
          case "$FORMATTER" in
            prettier)
              if ! npx prettier --check .; then
                echo "::error::Formatting is not clean. Run: npx prettier --write ."
                exit 1
              fi
              ;;
            biome)
              if ! npx biome format .; then
                echo "::error::Formatting is not clean. Run: npx biome format --write ."
                exit 1
              fi
              ;;
            *)
              echo "::error::FORMATTER must be prettier or biome" >&2
              exit 1
              ;;
          esac

      # A lock file that no longer matches package.json produces a diff on
      # somebody else's unrelated pull request. The `--frozen-lockfile`
      # install above already fails in that case, so this step exists to give
      # the failure a message that says what to do about it.
      - name: Lock file is current
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- package-lock.json pnpm-lock.yaml yarn.lock; then
            echo "::error::The lock file changed during install, which means it did not match package.json."
            echo "Run your package manager's install locally and commit the lock file."
            exit 1
          fi
          echo "lock file: clean"

      # package.json's own formatting and field order. `npx sort-package-json
      # --check` is the least controversial way to stop the file becoming a
      # pile of appended keys. Delete this step if it is more discipline than
      # the project wants.
      - name: package.json is tidy
        run: |
          set -euo pipefail
          if ! npx --yes sort-package-json --check; then
            echo "::error::package.json keys are out of order. Run: npx sort-package-json"
            exit 1
          fi

      # Delete this step if the project has no Markdown worth checking. It is
      # here because a README that will not render is a release-day surprise.
      - name: docs
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: |
            **/*.md
            !node_modules/**
            !.github/**
