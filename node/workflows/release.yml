name: Release

# Cuts a release, publishes to npm with provenance, and attaches signed
# artifacts to the GitHub release.
#
# The shape is: release-please holds a release pull request open against main,
# accumulating the changelog from conventional commit subjects. Merging that
# pull request tags the release, and the tag is what unblocks the publish job.
# Nothing here runs on an ordinary merge.
#
# ABOUT `npm publish --provenance`
#   npm's own provenance. The registry records which repository, workflow and
#   commit produced the tarball, verifies it against Sigstore, and shows a
#   "Built and signed on GitHub Actions" badge on the package page. It needs
#   `id-token: write` and nothing else, and it only works from a public
#   repository publishing a public package.
#
# TOKEN OR NO TOKEN
#   npm supports trusted publishing: you tell npmjs.com, once, that this
#   repository's Release workflow may publish this package, and the workflow
#   proves who it is with an OIDC token. That is the better option — nothing
#   to store, nothing to rotate — and it is what this workflow assumes. Set it
#   up under the package's Settings -> Trusted publisher on npmjs.com.
#
#   If the registry does not support it, fall back to a granular automation
#   token in `secrets.NPM_TOKEN` and uncomment the NODE_AUTH_TOKEN line on the
#   publish step. Provenance still works either way.
#
# WHAT TO CHANGE
#   1. `PACKAGE_MANAGER`: npm, pnpm or yarn. The publish itself always uses
#      npm, because provenance is an npm feature; the manager only affects how
#      dependencies are installed and the project is built.
#   2. `WORKING_DIRECTORY`, if package.json is not at the repository root.
#   3. `REGISTRY_URL`, for a private or scoped registry.
#   4. `NPM_TAG`, if this is a prerelease line. `latest` is what `npm install`
#      picks; publish a beta as `next` so it does not become the default.
#   5. Delete the `github-release` job if the package only goes to npm and
#      nobody fetches tarballs from the release page.
#
# WHAT IT NEEDS
#   - release-please-config.json and .release-please-manifest.json at the
#     repository root. See universal/ in this library for both.
#   - Squash merging with the pull request title as the commit subject:
#       Settings -> General -> Pull Requests -> Default commit message
#   - A GitHub environment named `npm` (Settings -> Environments). Adding a
#     required reviewer to it turns every publish into a manual approval.
#   - `"publishConfig": { "access": "public" }` in package.json for a scoped
#     package, or the publish fails as private.
#   - A public repository for provenance and for the attestation steps.
#
# WHAT IT PRODUCES
#   - A tagged GitHub release with signed artifacts, and an npm release with
#     provenance.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # npm | pnpm | yarn
  PACKAGE_MANAGER: "pnpm"
  WORKING_DIRECTORY: "."
  PNPM_VERSION: "10"
  NODE_VERSION: "24"
  REGISTRY_URL: "https://registry.npmjs.org"
  NPM_TAG: "latest"

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: build
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.PACKAGE_MANAGER == 'pnpm'
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ env.PACKAGE_MANAGER }}
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/${{ env.PACKAGE_MANAGER == 'npm' && 'package-lock.json' || env.PACKAGE_MANAGER == 'pnpm' && 'pnpm-lock.yaml' || 'yarn.lock' }}

      - name: Install and build
        run: |
          set -euo pipefail
          case "$PACKAGE_MANAGER" in
            npm)  npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --immutable || yarn install --frozen-lockfile ;;
          esac
          npm run build --if-present

      # Packing here rather than in the publish job means the exact bytes that
      # get published are also the bytes that get attested and signed. Packing
      # twice would produce two tarballs and two different digests.
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p dist-pack
          npm pack --pack-destination dist-pack
          ls -l dist-pack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: ${{ env.WORKING_DIRECTORY }}/dist-pack/*.tgz
          retention-days: 5

  publish:
    name: publish to npm
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # The environment is not decoration: npm's trusted publisher
    # configuration can name it, so a run outside this environment cannot
    # publish even from this repository. Add a required reviewer for a manual
    # gate on every release.
    environment:
      name: npm
    permissions:
      # The OIDC token that both provenance and trusted publishing use.
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: dist-pack

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Writes the .npmrc that the publish reads. Without it, publish
          # goes to whatever registry happens to be configured.
          registry-url: ${{ env.REGISTRY_URL }}

      # Provenance requires a reasonably recent npm; the one bundled with
      # Node 20 is old enough to lack it on some releases. Pinned rather than
      # @latest so the tool holding the publish token is a reviewed version.
      - name: Update npm
        run: npm install --global npm@12.2.1 # zizmor: ignore[adhoc-packages] exact version, see above

      - name: Publish
        run: |
          set -euo pipefail
          # A glob rather than `ls`, so a filename with a space in it
          # cannot split into two words.
          tarballs=(dist-pack/*.tgz)
          npm publish "${tarballs[0]}" --provenance --tag "${NPM_TAG}" --access public
        env:
          # Only needed if the registry does not support trusted publishing.
          # NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  # The same tarball, attached to the GitHub release, attested and signed.
  # npm's provenance only helps somebody installing from the registry; this
  # helps anybody who fetched the file from the release page, and it is what
  # `gh attestation verify` reads.
  github-release:
    name: sign and attach to the release
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Uploading to the release.
      contents: write
      # Both the attestation and the cosign signature are bound to this token.
      id-token: write
      # Writing to the repository's attestation store.
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: dist-pack

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist-pack
          sha256sum ./*.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-pack/*.tgz

      # Syft reads the tarball's package.json and lock file, so the SBOM
      # describes the dependency tree the package declares.
      - name: Generate an SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist-pack
          format: spdx-json
          output-file: dist-pack/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist-pack/*.tgz
          sbom-path: dist-pack/sbom.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the tarball
        working-directory: dist-pack
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for f in *.tgz SHA256SUMS; do
            cosign sign-blob --bundle "${f}.sigstore" "$f"
          done

      - name: Attach to the release
        working-directory: dist-pack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" ./* --clobber
