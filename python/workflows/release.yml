name: Release

# Cuts a release, publishes to PyPI without a token, and attaches signed
# artifacts to the GitHub release.
#
# The shape is: release-please holds a release pull request open against main,
# accumulating the changelog from conventional commit subjects. Merging that
# pull request tags the release, and the tag is what unblocks the build and
# publish jobs. Nothing here runs on an ordinary merge.
#
# This file builds a pure-Python distribution: one sdist and one
# `py3-none-any` wheel. If the project has a compiled extension module and
# needs a wheel per platform and architecture, use
# release-binary-wheels.yml beside this file instead.
#
# THERE IS NO API TOKEN
#   Publishing uses PyPI's trusted publishing: PyPI is told, once, that this
#   repository's Release workflow may publish this project, and the workflow
#   proves who it is with a short-lived OIDC token. Nothing to store, nothing
#   to rotate, nothing to leak, and a stolen token is useless outside this
#   workflow. Set it up at:
#     https://pypi.org/manage/project/PROJECT/settings/publishing/
#   with: owner, repository, workflow filename (release.yml), and the
#   environment name (pypi, matching the `environment:` block below).
#
# WHAT EACH ARTIFACT COMES WITH
#   On PyPI:      PEP 740 attestations, generated by the publish action from
#                 the same OIDC identity. `pip` will verify these.
#   On GitHub:    the sdist and wheel, a .sigstore bundle for each, and a
#                 signed SLSA provenance statement in the attestation store.
#
# HOW A USER VERIFIES IT
#   gh attestation verify ./project-1.2.3-py3-none-any.whl --repo OWNER/REPO
#
# WHAT TO CHANGE
#   1. `WORKING_DIRECTORY`, if pyproject.toml is not at the repository root.
#   2. The `environment: name:` on the publish job, if you called the PyPI
#      environment something else. It has to match what PyPI was told.
#   3. Delete the `testpypi` job if you do not want a rehearsal publish.
#
# WHAT IT NEEDS
#   - release-please-config.json and .release-please-manifest.json at the
#     repository root. See universal/ in this library for both.
#   - Squash merging with the pull request title as the commit subject:
#       Settings -> General -> Pull Requests -> Default commit message
#   - A GitHub environment named `pypi` (Settings -> Environments). Adding a
#     required reviewer to it turns every publish into a manual approval,
#     which is worth doing.
#   - A public repository, or GitHub Advanced Security, for the attestation
#     step. On a private repository without it, delete that step.
#   - No secrets.
#
# WHAT IT PRODUCES
#   - A tagged GitHub release with signed artifacts, and a PyPI release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKING_DIRECTORY: "."

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: build
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}
          # setuptools-scm and hatch-vcs derive the version from the git
          # history. A shallow clone gives them 0.1.dev1 and the artifact is
          # mislabelled, which is not something the publish step would catch.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # `uv build` drives whichever build backend pyproject.toml declares, so
      # this works for a Poetry, Hatch or setuptools project alike. That is
      # why the release path does not need the PACKAGE_MANAGER knob the other
      # workflows in this directory use.
      - name: Build
        run: uv build --sdist --wheel --out-dir dist

      - name: Check the metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ env.WORKING_DIRECTORY }}/dist/
          # The publish job needs these; a short retention is fine.
          retention-days: 5

  # A rehearsal against TestPyPI before the real thing. Catches a name
  # collision, a metadata field PyPI rejects, and a misconfigured publisher,
  # none of which are recoverable on PyPI proper: a version number, once
  # uploaded, can be deleted but never reused.
  #
  # Needs its own trusted publisher registered at test.pypi.org. Delete this
  # job and the `needs` reference below if you would rather not.
  testpypi:
    name: publish to TestPyPI
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
    permissions:
      # The OIDC token that stands in for an API token.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # A version already there from an earlier rehearsal should not fail
          # the release.
          skip-existing: true

  publish:
    name: publish to PyPI
    needs: [release-please, build, testpypi]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # The environment is not decoration: PyPI's trusted publisher
    # configuration names it, so a workflow run outside this environment
    # cannot publish even if it is in this repository. Add a required
    # reviewer to it for a manual gate on every release.
    environment:
      name: pypi
      url: https://pypi.org/p/${{ github.event.repository.name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # `attestations` defaults to true and needs no configuration: the action
      # signs each file with the same OIDC identity and uploads a PEP 740
      # attestation alongside it. Named explicitly here because it is the
      # provenance story for the PyPI side and worth being able to see.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
          print-hash: true

  # The same artifacts, attached to the GitHub release and signed there too.
  # PyPI's attestations only help somebody installing with pip; these help
  # anybody who fetched the tarball from the release page.
  github-release:
    name: sign and attach to the release
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Uploading to the release.
      contents: write
      # Both the attestation and the cosign signature are bound to this token.
      id-token: write
      # Writing to the repository's attestation store.
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      # A signed SLSA provenance statement: which workflow, at which commit,
      # on which runner, produced exactly these bytes. Stored by GitHub
      # against the repository and checked with `gh attestation verify`.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.whl

      - name: Generate an SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.whl
          sbom-path: dist/sbom.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Belt and braces alongside the attestation. The attestation lives in
      # GitHub's store and needs `gh` to check; these bundles sit next to the
      # artifacts and can be checked by anyone with cosign and no GitHub
      # account. Keyless, so there is no key to manage.
      - name: Sign the artifacts
        working-directory: dist
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for f in *.tar.gz *.whl SHA256SUMS; do
            cosign sign-blob --bundle "${f}.sigstore" "$f"
          done

      - name: Attach to the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" ./* --clobber
