name: Release (binary wheels)

# The release path for a project with a compiled extension module, where
# "multiple architectures" means a wheel per platform-architecture-interpreter
# combination rather than one `py3-none-any` wheel.
#
# Use this INSTEAD OF release.yml, not alongside it: two workflows publishing
# the same version to PyPI will race, and the loser fails. Everything else
# about the shape is the same — release-please gates it, trusted publishing
# needs no token, and the artifacts are attested and signed.
#
# WHY CIBUILDWHEEL
#   Building a wheel that runs on other people's machines is not the same as
#   compiling the code. A Linux wheel has to be built against an old enough
#   glibc to satisfy the manylinux tag it claims, have its shared library
#   dependencies bundled in, and be repaired so the tag is honest. macOS needs
#   a deployment target and a universal2 or per-arch build. cibuildwheel does
#   all of that in containers, runs the test suite inside each built wheel,
#   and produces one file per target. Doing it by hand produces wheels that
#   install and then fail to import on somebody else's distribution.
#
# WHAT TO CHANGE
#   1. `CIBW_BUILD`: which interpreter and platform tags to build. The syntax
#      is `{python tag}-{platform tag}`, e.g. `cp311-manylinux_x86_64`. The
#      default below builds CPython 3.11 to 3.13 for every platform the
#      matrix covers. `cibuildwheel --print-build-identifiers` lists every
#      identifier available on a given runner.
#   2. `CIBW_SKIP`: targets to leave out. musllinux and 32-bit are the usual
#      ones to drop first; they roughly double the build time and few people
#      need them.
#   3. The `build-wheels` matrix. One entry per runner, and the runner
#      determines which architectures are reachable:
#        ubuntu-latest      manylinux/musllinux x86_64 and i686
#        ubuntu-24.04-arm   manylinux/musllinux aarch64 — a native arm64
#                           runner, and much faster than QEMU emulation
#        macos-15-intel     macOS x86_64 (Intel runner; macos-13 is retired)
#        macos-latest       macOS arm64, and universal2 if asked for
#        windows-latest     win_amd64 and win32
#        windows-11-arm     win_arm64
#      Add or remove rows; each one is an independent job.
#   4. `CIBW_TEST_COMMAND`, so each wheel is tested after it is built. A wheel
#      that is not imported in the environment it targets is a wheel you find
#      out about from a bug report.
#
# WHAT IT NEEDS
#   - The same PyPI trusted publisher and `pypi` GitHub environment as
#     release.yml. See the header there for the setup.
#   - release-please-config.json and .release-please-manifest.json.
#   - A public repository, or GitHub Advanced Security, for the attestations.
#   - No secrets.
#
# WHAT IT PRODUCES
#   - One wheel per target plus one sdist, all attested and signed, on both
#     PyPI and the GitHub release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-wheels:
    name: wheels (${{ matrix.os }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-latest
          - windows-latest
          # Uncomment for arm64 Windows wheels. Slower to schedule, and few
          # dependencies publish for it yet.
          # - windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}
          # setuptools-scm and hatch-vcs read the version from the git
          # history; a shallow clone mislabels every wheel.
          fetch-depth: 0

      - name: Build the wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          # CPython 3.11 through 3.13. Add `pp*` for PyPy if the extension
          # supports it; add cp314 once the project is tested against it.
          CIBW_BUILD: "cp311-* cp312-* cp313-*"
          # 32-bit targets and musl, which together roughly double the build
          # time. Remove a pattern from this list when somebody asks for it.
          CIBW_SKIP: "*-musllinux_* *_i686 *-win32"
          # Runs inside the built wheel's own environment, on the target
          # platform, which is the only place an import error or a missing
          # bundled library will show up.
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "pytest {project}/tests"
          # Oldest macOS this wheel claims to support. Raising it drops
          # support for older machines; lowering it can fail to compile.
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One artifact per runner, collected by the publish job's glob.
          name: dist-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          retention-days: 5

  build-sdist:
    name: sdist
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # The sdist matters more for a compiled project than a pure-Python one:
      # it is what anyone on a platform you did not build a wheel for will
      # compile from.
      - name: Build the sdist
        run: uv build --sdist --out-dir dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          retention-days: 5

  publish:
    name: publish to PyPI
    needs: [release-please, build-wheels, build-sdist]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ github.event.repository.name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Collects every dist-* artifact the matrix produced into one
          # directory.
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: List what is about to be published
        run: ls -l dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
          print-hash: true

  github-release:
    name: sign and attach to the release
    needs: [release-please, build-wheels, build-sdist]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.whl

      - name: Generate an SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.whl
          sbom-path: dist/sbom.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the artifacts
        working-directory: dist
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for f in *.tar.gz *.whl SHA256SUMS; do
            cosign sign-blob --bundle "${f}.sigstore" "$f"
          done

      - name: Attach to the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" ./* --clobber
