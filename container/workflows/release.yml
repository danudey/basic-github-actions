name: Release

# Publishes a signed, attested, multi-architecture image to GHCR.
#
# The shape is: release-please holds a release pull request open against main,
# accumulating the changelog from conventional commit subjects. Merging that
# pull request tags the release, and the tag is what unblocks the build.
# Nothing here runs on an ordinary merge.
#
# HOW THE MULTI-ARCHITECTURE BUILD WORKS
#   Building `--platform linux/amd64,linux/arm64` in one job means emulating
#   one of them through QEMU, which can be ten times slower than a native
#   compile. So this workflow does it the other way round:
#
#     build      one job per platform, each on a native runner, each pushing
#                an unnamed image by digest only.
#     manifest   one job that assembles those digests into a single
#                multi-arch manifest under the real tags. A `docker pull` of
#                that tag then gets the right architecture automatically.
#
#   The cost is a slightly longer workflow file. The gain is a release that
#   takes minutes rather than the better part of an hour.
#
# WHAT THE IMAGE COMES WITH
#   - BuildKit provenance (`mode=max`): the full build graph, every base image
#     digest, every build argument, as an attestation in the registry beside
#     the image.
#   - A BuildKit SBOM attestation, generated from the image's own filesystem.
#   - A GitHub SLSA provenance attestation, pushed to the registry and also
#     recorded in the repository's attestation store.
#   - A keyless cosign signature over the manifest digest.
#
#   None of it needs a key. Everything is bound to the workflow's OIDC
#   identity, so what a verifier checks is "this image was built by this
#   workflow, in this repository, from this commit".
#
# HOW A USER VERIFIES IT
#   gh attestation verify oci://ghcr.io/OWNER/REPO:1.2.3 --repo OWNER/REPO
#
#   cosign verify ghcr.io/OWNER/REPO:1.2.3 \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github.com/OWNER/REPO/'
#
#   docker buildx imagetools inspect ghcr.io/OWNER/REPO:1.2.3 \
#     --format '{{ json .Provenance }}'
#
# WHAT TO CHANGE
#   1. `REGISTRY` and `IMAGE_NAME`, if not GHCR at <owner>/<repo>. For Docker
#      Hub, set REGISTRY to `docker.io`, IMAGE_NAME to `<user>/<repo>`, and
#      replace the login step's credentials with a `DOCKERHUB_TOKEN` secret —
#      Docker Hub has no OIDC equivalent, so that one does need a secret.
#   2. `DOCKERFILE` and `BUILD_CONTEXT`.
#   3. The `platform` matrix. Keep it identical to the one in ci.yml, or CI
#      stops being a rehearsal for the release.
#   4. The `tags` in the metadata step, if you want a different tagging
#      scheme. As written a release of 1.2.3 publishes `1.2.3`, `1.2`, `1`
#      and `latest`, which is what most consumers expect.
#
# WHAT IT NEEDS
#   - release-please-config.json and .release-please-manifest.json at the
#     repository root. See universal/ in this library for both.
#   - Squash merging with the pull request title as the commit subject:
#       Settings -> General -> Pull Requests -> Default commit message
#   - No secrets for GHCR: `secrets.GITHUB_TOKEN` with `packages: write` is
#     enough, and is scoped to this repository.
#   - A public repository, or GitHub Advanced Security, for the GitHub
#     attestation step. The BuildKit attestations and the cosign signature
#     work either way.
#
# WHAT IT PRODUCES
#   - A tagged GitHub release, and a multi-arch image in GHCR with the
#     attestations above.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERFILE: "./Dockerfile"
  BUILD_CONTEXT: "."

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: build (${{ matrix.platform }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # Pushing to GHCR.
      packages: write
      # The OIDC token the attestation and the signature are bound to.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Normalise the image reference
        id: ref
        run: |
          set -euo pipefail
          # GHCR requires a lower-case path; repository names may not be.
          echo "image=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          # A filesystem-safe form of the platform, for the artifact name.
          echo "slug=$(echo "${{ matrix.platform }}" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only. The tags are applied by the manifest job, because a
      # per-platform build must not claim a tag — the second platform to
      # finish would overwrite the first.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.ref.outputs.image }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # `push-by-digest` publishes the image with no tag at all. The
          # manifest job below collects the digests and gives them tags, which
          # is what stops two platform builds fighting over one tag.
          outputs: type=image,name=${{ steps.ref.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # `mode=max` records the whole build graph rather than just the
          # final layer: every base image digest, every build argument, every
          # intermediate stage. It is the difference between provenance that
          # proves who built it and provenance that also shows what from.
          provenance: mode=max
          # BuildKit generates the SBOM by scanning the built filesystem, so
          # it describes what is actually in the image rather than what the
          # manifest declares.
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Each platform build writes its digest to a uniquely named file; the
      # manifest job downloads all of them at once. This is how one job learns
      # what the other jobs produced without the matrix outputs clobbering
      # each other.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SLUG: ${{ steps.ref.outputs.slug }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          echo "$DIGEST" > "/tmp/digests/$SLUG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ steps.ref.outputs.slug }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: manifest and sign
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalise the image reference
        id: ref
        run: |
          set -euo pipefail
          echo "image=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # A release of 1.2.3 gets `1.2.3`, `1.2`, `1` and `latest`. The moving
      # tags are what let a consumer say "track patches of 1.2" and mean it.
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.ref.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest
            type=sha,format=long

      - name: Create and push the manifest
        id: manifest
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          image="$IMAGE"
          # One `-t` per tag from the metadata step, and one source reference
          # per platform digest.
          tags=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tags+=("-t" "$tag")
          done <<< "$TAGS"

          sources=()
          for f in /tmp/digests/*; do
            sources+=("${image}@$(cat "$f")")
          done

          echo "Assembling ${#sources[@]} platform images under ${#tags[@]} tag flags"
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

          # The digest of the manifest list itself. This, not a tag, is what
          # gets signed and attested: a tag can be moved, a digest cannot.
          digest=$(docker buildx imagetools inspect "${image}:latest" \
            --format '{{ json .Manifest.Digest }}' | tr -d '"')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Manifest digest: ${digest}"

      # A signed SLSA provenance statement over the manifest digest, pushed
      # into the registry beside the image and also recorded in GitHub's
      # attestation store. `gh attestation verify oci://...` reads it.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ref.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          # Stores the attestation in the registry as well, so it travels
          # with the image if it is mirrored somewhere GitHub cannot be
          # reached.
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the certificate is issued to this workflow's OIDC identity.
      # Signing the digest rather than a tag is the point — signing
      # `image:latest` would produce a signature that stops matching the
      # moment the tag moves.
      - name: Sign the manifest
        env:
          COSIGN_YES: "true"
          IMAGE: ${{ steps.ref.outputs.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign "${IMAGE}@${DIGEST}"

      # Written into the release notes so a user can copy the digest rather
      # than trusting the tag.
      - name: Summarise
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          IMAGE: ${{ steps.ref.outputs.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo "### Image"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Tags: ${TAGS}" | tr '\n' ' '
          } >> "$GITHUB_STEP_SUMMARY"
